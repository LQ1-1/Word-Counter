<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深色极简单词计数器</title>
  <link rel="stylesheet" href="CSS/myWordCounter.css" />

</head>

<body>
  <div class="container">
    <header>
      <h1 id="appTitle">Word Counter</h1>

      <div class="timer">
        <div class="language-picker">
          <label id="langLabel" class="language-label" for="langSelect">语言</label>
          <select id="langSelect" class="language-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="he">עברית</option>
          </select>
        </div>
        <div id="timerDisplay" class="timer-display">00:00</div>
        <button id="timerToggleBtn" type="button">开始</button>
        <button id="timerResetBtn" type="button">重置</button>
      </div>
    </header>

    <div class="editor-shell">
      <aside id="sidebar" class="sidebar collapsed" aria-hidden="true">
        <div class="sidebar-inner">
          <div class="sidebar-header">
            <div id="titleLabel" class="sidebar-title">题目 (Title)</div>

            <!-- ✅ 题目颜色自定义 -->
            <div class="color-picker">
              <span id="colorLabel" class="color-picker-label">颜色</span>
              <input id="titleColorPicker" type="color" value="#8be9fd" title="选择题目颜色" />
            </div>
          </div>

          <div
            id="titleInput"
            class="title-editor"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="在此粘贴或输入题目..."
          ></div>

          <div class="title-image-tools">
            <div class="title-image-header">
              <span id="titleImageLabel" class="title-image-label">题目图片</span>
              <label class="image-upload-btn">
                <span id="titleImageUploadText">上传图片</span>
                <input id="titleImageInput" type="file" accept="image/*" multiple />
              </label>
              <button id="clearTitleImagesBtn" type="button">清空图片</button>
            </div>
            <div id="titleImageList" class="title-image-list" aria-live="polite"></div>
          </div>

          <div id="titleImageViewer" class="title-image-viewer" aria-hidden="true">
            <button id="titleImagePrev" class="viewer-nav prev" type="button" aria-label="上一张">‹</button>
            <img id="titleImageViewerImg" alt="title image preview" />
            <button id="titleImageNext" class="viewer-nav next" type="button" aria-label="下一张">›</button>
            <button id="titleImageClose" class="viewer-close" type="button" aria-label="关闭">×</button>
          </div>
        </div>
      </aside>

      <div class="main-editor">
        <button id="sidebarToggleBtn" class="sidebar-toggle" type="button" aria-expanded="false">
          <span id="chev" class="chev"></span>
          <span id="toggleText">打开题目栏</span>
        </button>

        <textarea id="textInput" placeholder="请在此粘贴或输入文本..."></textarea>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-box">
        <span id="wordCount" class="stat-number">0</span>
        <span id="wordCountLabel" class="stat-label">单词数 (Words)</span>
      </div>
      <div class="stat-box">
        <span id="charCount" class="stat-number">0</span>
        <span id="charCountLabel" class="stat-label">字符数 (Chars)</span>
      </div>
      <div class="stat-box">
        <span id="charCountNoSpace" class="stat-number">0</span>
        <span id="charCountNoSpaceLabel" class="stat-label">字符 (不含空格)</span>
      </div>
    </div>

    <div class="footer-controls">
      <button id="clearTextBtn" type="button" onclick="clearText()">清空文本</button>
      <button id="exportMdBtn" class="export-btn" type="button">导出为 .md</button>
    </div>
  </div>

  <div id="contextMenu" class="context-menu" role="menu" aria-hidden="true">
    <button id="underlineBtn" type="button">下划线</button>
    <div id="contextHint" class="hint">提示：先选中文字，再右键</div>
  </div>

  <script src="Script/myWordCounter.js"></script>
